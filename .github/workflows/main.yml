# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]
    paths:
      - 'README.md'
      - '**/README.md'
      - '.github/workflows/main.yml'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v5
      
      - name: Build static content
        run: |
          # Create a beautiful landing page (NO AUTO-REDIRECT)
          cat > index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Wokwi Basic Embedded</title>
            <style>
              * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
              }
              body {
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                margin: 0;
                background: #0d1117;
                color: #c9d1d9;
                padding: 20px;
              }
              .container {
                text-align: center;
                padding: 2rem;
                max-width: 850px;
                width: 100%;
              }
              .logo {
                font-size: 4rem;
                margin-bottom: 0.5rem;
              }
              h1 {
                font-size: 2.8rem;
                margin-bottom: 0.5rem;
                background: linear-gradient(135deg, #58a6ff, #f0883e);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
              }
              .subtitle {
                font-size: 1.2rem;
                color: #8b949e;
                margin-bottom: 2rem;
              }
              .badges {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 0.5rem;
                margin: 1.5rem 0;
              }
              .badges img {
                height: 28px;
              }
              .btn-group {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 0.75rem;
                margin: 1.5rem 0;
              }
              .btn {
                display: inline-block;
                padding: 12px 28px;
                background: #238636;
                color: white;
                text-decoration: none;
                border-radius: 6px;
                font-weight: 600;
                transition: all 0.2s;
              }
              .btn:hover {
                background: #2ea043;
                transform: scale(1.02);
              }
              .btn-secondary {
                background: #21262d;
                color: #c9d1d9;
              }
              .btn-secondary:hover {
                background: #30363d;
              }
              .btn-outline {
                background: transparent;
                color: #58a6ff;
                border: 1px solid #58a6ff;
              }
              .btn-outline:hover {
                background: #1f2937;
              }
              .stats {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 1rem;
                margin: 2.5rem 0;
              }
              .stat-card {
                background: #161b22;
                padding: 1.2rem;
                border-radius: 8px;
                border: 1px solid #30363d;
                transition: border-color 0.2s;
              }
              .stat-card:hover {
                border-color: #58a6ff;
              }
              .stat-number {
                font-size: 2rem;
                font-weight: 700;
                color: #58a6ff;
              }
              .stat-label {
                font-size: 0.8rem;
                color: #8b949e;
                margin-top: 0.25rem;
              }
              .roadmap {
                text-align: left;
                margin: 2.5rem 0;
                background: #161b22;
                padding: 1.5rem;
                border-radius: 8px;
                border: 1px solid #30363d;
              }
              .roadmap h3 {
                color: #c9d1d9;
                margin-bottom: 1rem;
                font-size: 1.2rem;
              }
              .roadmap-item {
                display: flex;
                justify-content: space-between;
                padding: 0.6rem 0;
                border-bottom: 1px solid #21262d;
              }
              .roadmap-item:last-child {
                border-bottom: none;
              }
              .roadmap-item .name {
                color: #c9d1d9;
              }
              .roadmap-item .status {
                font-weight: 600;
              }
              .status-done { color: #238636; }
              .status-progress { color: #f0883e; }
              .status-planned { color: #8b949e; }
              
              .footer {
                margin-top: 3rem;
                color: #8b949e;
                font-size: 0.9rem;
              }
              .footer a {
                color: #58a6ff;
                text-decoration: none;
              }
              .footer a:hover {
                text-decoration: underline;
              }
              .footer-links {
                display: flex;
                justify-content: center;
                gap: 1.5rem;
                flex-wrap: wrap;
                margin-top: 1rem;
              }
              
              @media (max-width: 768px) {
                h1 { font-size: 2rem; }
                .stats { grid-template-columns: repeat(2, 1fr); }
                .badges img { height: 24px; }
              }
              @media (max-width: 480px) {
                h1 { font-size: 1.6rem; }
                .stats { grid-template-columns: 1fr; }
                .btn { width: 100%; justify-content: center; }
              }
            </style>
          </head>
          <body>
            <div class="container">
              <div class="logo">⚡</div>
              <h1>Wokwi Basic Embedded</h1>
              <p class="subtitle">
                Learning Path for ESP32 Embedded Systems
                <br>
                <span style="font-size: 0.9rem; color: #8b949e;">
                  From GPIO to Complete System Integration
                </span>
              </p>

              <div class="badges">
                <img src="https://img.shields.io/badge/ESP32-000000?style=for-the-badge&logo=espressif&logoColor=white" alt="ESP32">
                <img src="https://img.shields.io/badge/Arduino-00979D?style=for-the-badge&logo=arduino&logoColor=white" alt="Arduino">
                <img src="https://img.shields.io/badge/FreeRTOS-000000?style=for-the-badge&logo=freertos&logoColor=white" alt="FreeRTOS">
                <img src="https://img.shields.io/badge/Wokwi-Simulator-FF6C37?style=for-the-badge&logo=wokwi&logoColor=white" alt="Wokwi">
                <img src="https://img.shields.io/badge/License-MIT-blue?style=for-the-badge" alt="MIT License">
              </div>

              <div class="btn-group">
                <a href="https://github.com/ficrammanifur/wokwi-basic-embedded" class="btn">📂 View on GitHub</a>
                <a href="https://github.com/ficrammanifur/wokwi-basic-embedded/stargazers" class="btn btn-secondary">⭐ Star</a>
                <a href="https://github.com/ficrammanifur/wokwi-basic-embedded/fork" class="btn btn-secondary">🍴 Fork</a>
                <a href="#roadmap" class="btn btn-outline">📚 Roadmap</a>
              </div>

              <div class="stats">
                <div class="stat-card">
                  <div class="stat-number">42</div>
                  <div class="stat-label">Materi Pembelajaran</div>
                </div>
                <div class="stat-card">
                  <div class="stat-number">8</div>
                  <div class="stat-label">Modul</div>
                </div>
                <div class="stat-card">
                  <div class="stat-number">70%</div>
                  <div class="stat-label">Progress</div>
                </div>
                <div class="stat-card">
                  <div class="stat-number">⭐</div>
                  <div class="stat-label">Star Repository</div>
                </div>
              </div>

              <div class="roadmap" id="roadmap">
                <h3>📚 Learning Roadmap</h3>
                
                <div class="roadmap-item">
                  <span class="name">✅ 01 — Fundamental</span>
                  <span class="status status-done">100%</span>
                </div>
                <div class="roadmap-item">
                  <span class="name">🔄 02 — Communication</span>
                  <span class="status status-progress">60%</span>
                </div>
                <div class="roadmap-item">
                  <span class="name">📝 03 — Multitasking</span>
                  <span class="status status-planned">0%</span>
                </div>
                <div class="roadmap-item">
                  <span class="name">📝 04 — Synchronization</span>
                  <span class="status status-planned">0%</span>
                </div>
                <div class="roadmap-item">
                  <span class="name">📝 05 — System Management</span>
                  <span class="status status-planned">0%</span>
                </div>
                <div class="roadmap-item">
                  <span class="name">📝 06 — Program Architecture</span>
                  <span class="status status-planned">0%</span>
                </div>
                <div class="roadmap-item">
                  <span class="name">📝 07 — Optimization</span>
                  <span class="status status-planned">0%</span>
                </div>
                <div class="roadmap-item">
                  <span class="name">📝 08 — System Integration</span>
                  <span class="status status-planned">0%</span>
                </div>
              </div>

              <div class="footer">
                <p>
                  <strong>Author:</strong>
                  <a href="https://github.com/ficrammanifur">Ficram Manifur</a>
                  &nbsp;•&nbsp;
                  <strong>License:</strong> MIT
                </p>
                <div class="footer-links">
                  <a href="https://github.com/ficrammanifur/wokwi-basic-embedded#readme">📖 Documentation</a>
                  <a href="https://github.com/ficrammanifur/wokwi-basic-embedded/issues">🐛 Report Issue</a>
                  <a href="https://github.com/ficrammanifur/wokwi-basic-embedded#-kontribusi">🤝 Contribute</a>
                  <a href="https://wokwi.com/">🔧 Wokwi Simulator</a>
                </div>
                <p style="margin-top: 1.5rem; font-size: 0.8rem; color: #484f58;">
                  Built with ❤️ using ESP32 &amp; Wokwi Simulator
                </p>
              </div>
            </div>
          </body>
          </html>
          EOF
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
